name: Monthly Pocket Police Reminders

on:
  schedule:
    - cron: '0 9 1 * *'   # 09:00 UTC on the 1st of every month
  workflow_dispatch:        # allow manual runs for testing
    inputs:
      dryRun:
        description: 'Preview without sending (true/false)'
        required: false
        default: 'false'

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke send-monthly-reminders endpoint
        # Secrets are passed as env vars (NOT inlined into the script) so the shell
        # never re-expands special characters like $ & ^ inside the secret value.
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY: ${{ github.event.inputs.dryRun }}
        run: |
          QS=""
          if [ "$DRY" = "true" ]; then QS="?dryRun=1"; fi
          curl --fail --silent --show-error \
            -X POST "${BACKEND_URL}/api/cron/send-monthly-reminders${QS}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
